[project]
name = "dsg-check"
version = "0.0.1"
description = "Prüft Datenschutzerklärungen gegen das Schweizer DSG, mit LLMs, RAG und einem Agenten. Lernprojekt aus dem AI Engineer Bootcamp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "tiktoken>=0.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
dsgcheck = "dsgcheck.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsgcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
