name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Abhängigkeiten installieren
        run: uv sync
      - name: Linter
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
